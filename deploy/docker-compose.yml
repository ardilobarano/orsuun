# Playtest deployment on one Linux VM: PostgreSQL + game server + Caddy (automatic HTTPS).
#   cp deploy/.env.example deploy/.env   # then edit DOMAIN and POSTGRES_PASSWORD
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# Without a domain, DOMAIN=<public-ip>.sslip.io works: Let's Encrypt issues certificates for it.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: orsuun
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: orsuun
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orsuun -d orsuun"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      # appsettings.json pins Urls to localhost:5080 for the local run and appsettings.*.json is layered after the
      # ASPNETCORE_-prefixed host config, so ASPNETCORE_URLS loses. The unprefixed env var is read after the JSON
      # files and wins; the container must listen on all interfaces on the port Caddy and the healthcheck expect.
      URLS: http://0.0.0.0:8080
      ConnectionStrings__Game: "Host=postgres;Port=5432;Database=orsuun;Username=orsuun;Password=${POSTGRES_PASSWORD}"
      Bells__TimeZone: ${BELLS_TIMEZONE:-Europe/Istanbul}
      # Moderators (the /admin page): comma-separated emails of game accounts. Empty = nobody can sign in there.
      Admin__Emails: ${ADMIN_EMAILS:-}
      # Sign in with Google / Apple (Game/ExternalAuth.cs). Empty = that button is not offered.
      Auth__PublicUrl: https://${DOMAIN}
      Auth__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Auth__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Auth__Apple__ServicesId: ${APPLE_SERVICES_ID:-}
      Auth__Apple__BundleId: com.orsuun.warofbanners
      # Email for password reset codes (Game/MailSender.cs). Empty = a Development server logs them; others say it is off.
      Mail__Host: ${MAIL_HOST:-}
      Mail__Port: ${MAIL_PORT:-587}
      Mail__User: ${MAIL_USER:-}
      Mail__Password: ${MAIL_PASSWORD:-}
      Mail__From: ${MAIL_FROM:-}
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../downloads:/srv/downloads:ro
      - ./site:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
